[project]
name = "omarchy-claude-sessions"
version = "1.0.0"
description = "Backend for the Claude Sessions omarchy-shell bar widget"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "S603"]
